version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directories:
      - "/clean-architecture"
      - "/aspire-template"
    schedule:
      interval: "weekly"
    groups:
      template-dependencies:
        patterns:
          - "*"

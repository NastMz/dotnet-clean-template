name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Weekly run to catch newly published package vulnerabilities, which fail generated builds.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  validate-templates:
    name: Validate generated templates
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run template validation
        shell: pwsh
        run: ./scripts/validate-generated-templates.ps1 -PackageVersion 0.0.0-ci

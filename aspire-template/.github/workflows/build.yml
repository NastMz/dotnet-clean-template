name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.x"
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CleanArchitecture.slnx

      - name: Build
        run: dotnet build CleanArchitecture.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution CleanArchitecture.slnx --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish CleanArchitecture.slnx --configuration Release --no-restore --no-build
